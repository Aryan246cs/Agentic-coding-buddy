<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Card</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div id="card" class="card">
        <h1 class="title">Happy Birthday!</h1>
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Enter your name" aria-label="Name" autocomplete="off" />
            <button id="submitBtn" type="button">Celebrate</button>
        </div>
        <div id="message" class="message hidden"></div>
    </div>
    <footer>
        <small>Made with love for your special day.</small>
    </footer>
</body>
</html>
