[project]
name = "workflow-platform"
version = "0.1.0"
description = "Describe how your work happens. Get a working system with a link."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.1.1",
    "httpx>=0.28.1",
    "groq>=0.31.0",
    "langgraph>=1.2.18,<2",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
